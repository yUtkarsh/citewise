<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Queue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" defer></script>
  <script src="shell.js" defer></script>
  <script src="review.js" defer></script>
</head>
<body class="page">
  <header class="topbar">
    <a class="brand brand-link" href="/"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Code Graph Agent</span></a>
    <div class="topbar-right">
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch theme" title="Switch theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>
  <main class="page-main wide">
    <a class="back" href="/">← Library</a>
    <div class="page-head">
      <div>
        <h1>Review queue</h1>
        <p class="lede" id="doc-line"></p>
      </div>
      <div class="card-actions" id="head-links"></div>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="review-layout">
      <div class="queue panel" id="queue" aria-label="Flagged items"></div>
      <div class="item panel" id="item"><p class="hint">Pick an item on the left.</p></div>
    </div>
  </main>
</body>
</html>
