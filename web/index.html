<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CiteWise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="shell.js" defer></script>
  <script src="library.js" defer></script>
</head>
<body class="page">
  <header class="topbar">
    <a class="brand brand-link" href="/"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">CiteWise</span></a>
    <div class="topbar-right">
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch theme" title="Switch theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main class="page-main">
    <div class="page-head">
      <div>
        <h1 class="app-title">CiteWise</h1>
        <p class="tagline">Ask any code a question. Every answer cited, every number checked.</p>
      </div>
    </div>

    <label class="dropzone" id="dropzone" for="file">
      <input type="file" id="file" accept="application/pdf,.pdf" hidden>
      <span class="dz-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 16V4m0 0l-5 5m5-5l5 5M4 20h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="dz-text"><strong>Add a code PDF</strong> — drop it here or click to choose.
        <span class="dz-sub">Digital PDFs with a text layer, up to 1,000 pages. The AI proposes a profile first; nothing else runs until you confirm. Pass 2 stops at the cost cap of <span id="max-cost">$3.00</span>.</span></span>
    </label>
    <div class="notice" id="notice" hidden></div>

    <section id="jobs" class="jobs" hidden>
      <h2 class="section-title">In progress</h2>
      <div id="job-list" class="job-list"></div>
    </section>

    <section>
      <h2 class="section-title">Codes</h2>
      <div id="cards" class="cards"><div class="card skeleton-card"></div><div class="card skeleton-card"></div></div>
    </section>
  </main>
</body>
</html>
