services:
  falkordb:
    # pinned to the version the graph was built and tested on (graph module 4.22.1)
    image: falkordb/falkordb:v4.22.1@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
    container_name: falkordb
    ports:
      - "6379:6379"   # Redis protocol (graph queries)
      - "3000:3000"   # FalkorDB browser UI
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    restart: unless-stopped

volumes:
  falkordb_data:
